<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link href="https://fonts.googleapis.com/css2?family=Recursive&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pattern Planter</title>
    <style>
      body {
        /* background-color: #222; */
        cursor: url(hand.png) 5 2, default;
        background: #cfc;
        margin: 0;
        min-width: 1920px;
      }

      #app {
        margin-left: auto;
        margin-right: auto;
        /* width: 800px; */
        width: 100%;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      #planter {
        width: 100%;
      }

      #buttons {
        display: flex;
        width: 100%;
      }

      button {
        display: block;
        flex-grow: 1;
        padding: 10px;
        font-family: 'Recursive', monospace;
        background: black;
        color: white;
        font-size: larger;
      }

      button.clicked, button:active {
        background: white;
        color: black;
      }

      input {
        width: 100%;
        font-family: 'Recursive', monospace;
        background: black;
        color: white;
        outline: none;
        margin: 0;
        border: none;
        font-size: larger;
      }

      .node-text {
        font-family: monospace;
      }

      #planter rect.node {
        stroke: black;
        fill: var(--tree-tint, white);
      }

      #planter rect.node.active {
        fill: yellow;
      }

      #planter path.link {
        stroke: black;
      }

      .owned path:hover {
        cursor: url(shears.png) 5 5, default;
      }

      .owned path:active {
        cursor: url(shears-closed.png) 5 5, default;
      }

      .owned rect:hover {
        cursor: url(watering-can.png) 0 10, default;
      }

      .owned rect:active {
        cursor: url(watering-can-pour.png) 0 10, default;
      }

      text {
        user-select: none;
        pointer-events: none;
      }

      #strudel {
        margin-top: auto;
        position: sticky;
        bottom: 0;
        overflow: none;
      }

      * {
        overflow: none !important;
      }

      #background-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -1;
      }

      #claim-bar {
        display: flex;
        width: 100%;
        gap: 2px;
      }

      #claim-bar .claim-btn {
        flex: 1 1 0;
        min-width: 0;
        padding: 6px 4px;
        font-family: 'Recursive', monospace;
        font-size: 14px;
        background: rgba(0, 0, 0, 0.6);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.3);
        cursor: pointer;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #claim-bar .claim-btn.mine {
        background: rgba(40, 140, 40, 0.85);
      }
      #claim-bar .claim-btn.taken {
        background: rgba(80, 80, 80, 0.8);
        cursor: not-allowed;
      }
      #claim-bar .claim-btn .owner-dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        vertical-align: middle;
        margin-right: 4px;
      }

      #cursors {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 1000;
      }
      .remote-cursor {
        position: absolute;
        width: 32px;
        height: 32px;
        pointer-events: none;
      }
      .remote-cursor .icon {
        position: absolute;
        width: 32px;
        height: 32px;
        object-fit: contain;
        object-position: top left;
        filter:
          drop-shadow(0 0 2px rgba(0, 0, 0, 0.6))
          drop-shadow(0 0 4px var(--cursor-color, transparent))
          drop-shadow(0 0 4px var(--cursor-color, transparent));
      }
#topbar {
        position: fixed;
        top: 8px;
        right: 8px;
        z-index: 1001;
        display: flex;
        gap: 6px;
        align-items: center;
      }

      #status-pill {
        font-family: 'Recursive', monospace;
        font-size: 12px;
        color: white;
        background: rgba(0, 0, 0, 0.7);
        padding: 4px 8px;
        border-radius: 4px;
      }

      #spectator-toggle {
        font-family: 'Recursive', monospace;
        font-size: 12px;
        color: white;
        background: rgba(0, 0, 0, 0.7);
        padding: 4px 8px;
        border-radius: 4px;
        cursor: pointer;
        user-select: none;
        display: flex;
        align-items: center;
        gap: 4px;
      }

      #spectator-toggle input {
        width: auto;
        margin: 0;
      }

      body.spectator #claim-bar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <video id="background-video" autoplay muted loop playsinline>
        <source src="background.mp4" type="video/mp4">
      </video>
      <div id="planter"></div>
      <div id="claim-bar"></div>
      <div id="strudel"></div>
    </div>
    <div id="cursors"></div>
    <div id="topbar">
      <label id="spectator-toggle"><input type="checkbox"> spectate</label>
      <div id="status-pill">connecting…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/strudel.js"></script>
  </body>
</html>
